name: Build OpenWrt 16MB for Archer C20 v4

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev file wget

      - name: Clone OpenWrt 23.05.5 sources
        run: |
          git clone --depth 1 --branch v23.05.5 https://github.com

      - name: Update and install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Patch DTS and Image Makefile for 16MB
        run: |
          cd openwrt
          # Расширяем раздел firmware и сдвигаем config/factory в конец 16 МБ флеш-памяти
          sed -i 's/0x7a0000/0xfa0000/g; s/0x7c0000/0xfc0000/g; s/0x7f0000/0xff0000/g; s/@7c0000/@fc0000/g; s/@7f0000/@ff0000/g' target/linux/ramips/dts/mt7628an_tplink_archer-c20-v4.dts

          # Увеличиваем лимит размера образа до 16000k и меняем разметку на 16Mmtk
          sed -i '/define Device\/tplink_archer-c20-v4/,/endef/ {
            s/IMAGE_SIZE := 7808k/IMAGE_SIZE := 16000k/
            s/TPLINK_FLASHLAYOUT := 8Mmtk/TPLINK_FLASHLAYOUT := 16Mmtk/
          }' target/linux/ramips/image/mt76x8.mk

      - name: Configure target and packages
        run: |
          cd openwrt
          cat << 'EOF' > .config
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt76x8=y
          CONFIG_TARGET_ramips_mt76x8_DEVICE_tplink_archer-c20-v4=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-i18n-base-ru=y
          CONFIG_PACKAGE_luci-i18n-firewall-ru=y
          EOF
          make defconfig

      - name: Build 16MB Firmware
        run: |
          cd openwrt
          make -j$(nproc) V=s

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-c20v4-16mb-firmware
          path: openwrt/bin/targets/ramips/mt76x8/*sysupgrade.bin
