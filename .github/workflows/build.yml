name: Build OpenWrt 16MB for Archer C20 v4

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev file wget

      - name: Clone OpenWrt 23.05.5 sources
        run: |
          REPO="https://github.com/openwrt/openwrt.git"
          git clone --depth 1 --branch v23.05.5 "$REPO"

      - name: Update and install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add 16Mmtk flash layout to mktplinkfw2
        run: |
          cd openwrt
          mkdir -p tools/firmware-utils/patches
          cat > tools/firmware-utils/patches/001-16Mmtk-layout.patch << 'PATCH_EOF'
          --- a/src/mktplinkfw2.c
          +++ b/src/mktplinkfw2.c
          @@ -149,6 +149,12 @@ static struct flash_layout layouts[] = {
           		.kernel_la	= 0x80000000,
           		.kernel_ep	= 0x80000000,
           		.rootfs_ofs	= 0x140000,
          +	}, {
          +		.id		= "16Mmtk",
          +		.fw_max_len	= 0xfa0000,
          +		.kernel_la	= 0x80000000,
          +		.kernel_ep	= 0x80000000,
          +		.rootfs_ofs	= 0x140000,
           	}, {
           		.id		= "8MSUmtk", /* Split U-Boot OS */
           		.fw_max_len	= 0x770000,
          PATCH_EOF
          echo "=== Патч для 16Mmtk создан ==="

      - name: Patch DTS and Image Makefile for 16MB
        run: |
          cd openwrt

          # 1. Расширяем разделы в конце флеш-памяти до 16 МБ.
          for f in target/linux/ramips/dts/mt7628an_tplink_8m.dtsi \
                   target/linux/ramips/dts/mt7628an_tplink_archer-c20-v4.dts; do
            if [ -f "$f" ]; then
              sed -i 's/0x7a0000/0xfa0000/g; s/0x7c0000/0xfc0000/g; s/0x7f0000/0xff0000/g; s/@7c0000/@fc0000/g; s/@7f0000/@ff0000/g' "$f"
            fi
          done

          # 2. Форсированно задаём параметры внутри блока устройства
          awk '
            /^define Device\/tplink_archer-c20-v4$/ { inblock=1 }
            inblock && /^endef$/ {
              print "  IMAGE_SIZE := 15872k"
              print "  TPLINK_FLASHLAYOUT := 16Mmtk"
              inblock=0
            }
            { print }
          ' target/linux/ramips/image/mt76x8.mk > mt76x8.mk.new
          mv mt76x8.mk.new target/linux/ramips/image/mt76x8.mk

          echo "=== Итоговый блок устройства ==="
          awk '/^define Device\/tplink_archer-c20-v4$/,/^endef$/' target/linux/ramips/image/mt76x8.mk

      - name: Configure target and packages
        run: |
          cd openwrt
          cat << 'EOF' > .config
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt76x8=y
          CONFIG_TARGET_ramips_mt76x8_DEVICE_tplink_archer-c20-v4=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-i18n-base-ru=y
          CONFIG_PACKAGE_luci-i18n-firewall-ru=y
          CONFIG_PACKAGE_kmod-nft-queue=y
          CONFIG_PACKAGE_kmod-nfnetlink-queue=y
          EOF
          make defconfig

      - name: Build 16MB Firmware
        run: |
          cd openwrt
          make -j$(nproc) V=s

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-c20v4-16mb-firmware
          path: openwrt/bin/targets/ramips/mt76x8/*sysupgrade.bin
